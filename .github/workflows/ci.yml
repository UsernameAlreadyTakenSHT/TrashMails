# Every push and pull request: the Gradle wrapper is the official one, and the app builds, tests
# and lints on Linux with JDK 21, as on F-Droid's build server. Dependency verification runs as
# part of the build, so an update that left gradle/verification-metadata.xml behind fails here.
# Actions are pinned to commit SHAs (a tag can be moved), version in the comment.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A fixed image: the environment changes when this line does, not when GitHub moves "latest".
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache (actions/cache), not the default "enhanced" one, a closed library.
          cache-provider: basic

      - name: Test, lint, build the release APK (unsigned)
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      # What a reproducible build is checked against: the same tree, built on Linux, must give these
      # bytes (the released APK is this one plus its signature block).
      - name: Unsigned APK checksum
        run: |
          {
            echo "### Unsigned release APK"
            echo '```'
            sha256sum app/build/outputs/apk/release/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/dependency-verification/
          retention-days: 7
